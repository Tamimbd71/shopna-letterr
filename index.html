<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Himu ❤️</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:"Segoe UI",sans-serif;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
overflow-x:hidden;
}

.cover{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
color:white;
}

.cover h1{
font-size:40px;
animation:heart 2s infinite;
}

button{
padding:15px 35px;
border:none;
border-radius:50px;
font-size:18px;
background:white;
color:#ff4f81;
box-shadow:0 5px 20px #999;
}

.letter{
display:none;
margin:20px;
padding:25px;
background:white;
border-radius:25px;
box-shadow:0 0 25px rgba(0,0,0,.2);
animation:show 1.5s;
}

.title{
text-align:center;
color:#ff4f81;
font-size:28px;
}

.text{
font-size:17px;
line-height:1.9;
white-space:pre-line;
color:#333;
}

@keyframes heart{
50%{
transform:scale(1.1);
}
}

@keyframes show{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<div class="cover" id="cover">

<h1>For You Himu ❤️</h1>

<button onclick="openLetter()">
Open Letter 💌
</button>

</div>


<div class="letter" id="letter">

<div class="title">
প্রিয় Himu ❤️
</div>

<div class="text" id="text"></div>

</div>


<script>

let message = প্রিয় হিমু ,

আজ চিঠি দিবস। তাই ভাবলাম, মুঠোফোনের পর্দায় কয়েকটি শব্দ ছুড়ে না দিয়ে, তোমার জন্য কিছু কথা কাগজের বুকে রেখে যাই। কিছু কথা মুখে উচ্চারিত হলে তার মাধুর্য হারায়, অথচ অক্ষরের শরীরে তারা নীরবে ফুটে ওঠে শিউলির মতো।

যদি কখনো আঁধার নামে, তবে মেই আঁধার ভেদ করে এক চিলতে জ্যোৎস্না যেন তোমার দুয়ারে এসে দাঁড়ায়।

তোমার স্বপ্নগুলো থাকুক শিশিরভেজা প্রভাতের মতো নির্মল, আর হৃদয়ের গোপন দুঃখগুলো মময়ের কোমল স্পর্শের কাছে ফিকে হয়ে যাক।

তোমার জীবনে এমন কিছু মুহূর্ত আমুক, যখন হৃদয় নিঃশব্দে বলে উঠবে-

"এই তো, এতদিন যার প্রতীক্ষায় ছিলাম।"

তোমার প্রতিটি প্রভাত হোক আশাময়, প্রতিটি নিশীথ হোক প্রশান্তিময়। পৃথিবী যতই নিষ্ঠুর হোক, তোমার অন্তরের মাধুর্য যেন কোনোদিন তার কাছে পরাজিত না হয়।


ভালো থেকো,

আজ, আগামীকাল এবং তোমার জীবনের প্রতিটি অনাগত দিবে। অতি যত্নে রেখো তোমার কোমল হৃদয়টুকু।

ইতি,

জ্যোৎস্নাভেজা শুভকামনায় -

মরু-পথিক

let i=0;


function openLetter(){

document.getElementById("cover").style.display="none";

document.getElementById("letter").style.display="block";

typeWriter();

}


function typeWriter(){

if(i < message.length){

document.getElementById("text").innerHTML += message.charAt(i);

i++;

setTimeout(typeWriter,35);

}

}

</script>

</body>
</html>
