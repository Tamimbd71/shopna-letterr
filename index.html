<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Himu ❤️</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:"Segoe UI",sans-serif;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
overflow-x:hidden;
}

.cover{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
color:white;
}

.cover h1{
font-size:40px;
animation:heart 2s infinite;
}

button{
padding:15px 35px;
border:none;
border-radius:50px;
font-size:18px;
background:white;
color:#ff4f81;
box-shadow:0 5px 20px #999;
}

.letter{
display:none;
margin:20px;
padding:25px;
background:white;
border-radius:25px;
box-shadow:0 0 25px rgba(0,0,0,.2);
animation:show 1.5s;
}

.title{
text-align:center;
color:#ff4f81;
font-size:28px;
}

.text{
font-size:17px;
line-height:1.9;
white-space:pre-line;
color:#333;
}

@keyframes heart{
50%{
transform:scale(1.1);
}
}

@keyframes show{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<div class="cover" id="cover">

<h1>For You Himu ❤️</h1>

<button onclick="openLetter()">
Open Letter 💌
</button>

</div>


<div class="letter" id="letter">

<div class="title">
প্রিয় Himu ❤️
</div>

<div class="text" id="text"></div>

</div>


<script>

let message = `কেমন আছো? আশা করি ভালো আছো।

জানি না এই চিঠিটা পড়ার সময় তোমার মুখে কেমন একটা হাসি ফুটবে, কিন্তু এটুকু জানি—এই চিঠির প্রতিটা শব্দ সত্যি মন থেকে লেখা।

জীবনে অনেক মানুষের সাথে পরিচয় হয়, কিন্তু কিছু মানুষ খুব অল্প সময়ের মধ্যেই মনের মধ্যে একটা আলাদা জায়গা করে নেয়। তুমি ঠিক তেমন একজন মানুষ।

তোমার সবচেয়ে সুন্দর একটা দিক হলো—তোমার যত্ন নেওয়ার অভ্যাস। আমি আগে থেকে মেসেজ না দিলেও তুমি নিজে থেকে খোঁজ নাও, কেমন আছি জিজ্ঞেস করো।

হয়তো তোমার কাছে এগুলো ছোট ছোট বিষয়, কিন্তু কারো মন ভালো করে দেওয়ার জন্য এই ছোট ছোট যত্নগুলো অনেক বড় একটা অনুভূতি হয়ে যায়।

তোমার সাথে কথা বললে একটা শান্তি অনুভব হয়। মনে হয়, কেউ একজন সত্যি মন থেকে আমার ভালো চায়।

আমি জানি, তোমার জীবন পথ সবসময় সহজ ছিল না। নিজের স্বপ্ন আর ভবিষ্যতের জন্য তুমি অনেক পরিশ্রম করছো, অনেক সংগ্রাম করছো।

কিন্তু আমার বিশ্বাস—যে মানুষ এত ধৈর্য নিয়ে নিজের লক্ষ্যের দিকে এগিয়ে যেতে পারে, সে একদিন অবশ্যই সফল হবে।

আমি মন থেকে চাই, তোমার জীবনের প্রতিটা স্বপ্ন পূরণ হোক। তোমার পরিশ্রমের প্রতিটা মুহূর্ত একদিন তোমার সাফল্যের গল্প হয়ে ফিরে আসুক।

নিজের যত্ন নিতে ভুলে যেও না। নিজের হাসি, নিজের স্বপ্ন আর নিজের সুখের কথাও ভাববে।

তোমার একটা মেসেজ দেখলে মন ভালো হয়ে যায়, তোমার সাথে কথা বললেও এক ধরনের মানসিক শান্তি পাওয়া যায়।

ভালো থেকো Himu।

সবসময় এমন সুন্দর মনের মানুষ হয়ে থেকো।

ইতি,
যে তোমার যত্ন, তোমার হাসি আর তোমার সুন্দর মনকে অনেক মূল্য দেয়। ❤️`;


let i=0;


function openLetter(){

document.getElementById("cover").style.display="none";

document.getElementById("letter").style.display="block";

typeWriter();

}


function typeWriter(){

if(i < message.length){

document.getElementById("text").innerHTML += message.charAt(i);

i++;

setTimeout(typeWriter,35);

}

}

</script>

</body>
</html>
