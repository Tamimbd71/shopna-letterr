<script>
let message = `প্রিয় স্বপ্না,

কেমন আছো? আশা করি ভালো আছো।

আজ চিঠি দিবস। তাই তোমাকে কিছু কথা বলতে ইচ্ছে হলো।

তোমার সুন্দর মন, তোমার যত্ন আর তোমার হাসি সত্যিই অনেক সুন্দর।

সবসময় ভালো থেকো।
নিজের যত্ন নিও।

ইতি,
যে তোমার হাসিকে অনেক মূল্য দেয় ❤️`;

let i = 0;

function openLetter(){
    document.getElementById("cover").style.display = "none";
    document.getElementById("letter").style.display = "block";
    typeWriter();
}

function typeWriter(){
    if(i < message.length){
        document.getElementById("text").innerHTML += message.charAt(i);
        i++;
        setTimeout(typeWriter, 50);
    }
}
</script>
